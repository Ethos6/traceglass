[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceglass"
version = "0.1.0"
description = "Evidence-first static inspection for Linux binaries and archives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atomesus Research Labs" }]

[project.scripts]
traceglass = "traceglass:main"

[tool.setuptools]
py-modules = ["traceglass"]
